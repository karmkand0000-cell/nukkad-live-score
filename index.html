<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nukkad Live Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#e11d2e; --brand2:#9f1239; --gold:#ffb703;
  --bg:#0b1020; --panel:#121a2e; --panel2:#1a2440; --line:#26324f;
  --txt:#f8fafc; --muted:#94a3b8;
  --four:#16a34a; --six:#7c3aed; --wk:#dc2626; --ext:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}

/* ===================== OVERLAY (OBS Browser Source 1920x1080) ===================== */
body.overlay{width:1920px;height:1080px;overflow:hidden;color:var(--txt);
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;}
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px}
.hide{display:none!important}

.titlechip{position:absolute;left:80px;top:48px;display:flex;align-items:center;gap:14px;
  background:rgba(11,16,32,.88);border-left:6px solid var(--brand);padding:10px 22px;border-radius:6px;
  font-size:30px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.titlechip .dot{width:14px;height:14px;border-radius:50%;background:var(--brand);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.banner{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--brand2),var(--brand));padding:14px 60px;border-radius:8px;
  font-size:54px;font-weight:800;letter-spacing:3px;text-transform:uppercase;box-shadow:0 10px 40px rgba(0,0,0,.5)}

.splash{position:absolute;left:50%;bottom:250px;transform:translateX(-50%) scale(.6);opacity:0;
  font-size:120px;font-weight:800;letter-spacing:6px;padding:6px 70px;border-radius:14px;
  text-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:none}
.splash.show{animation:pop 3s ease forwards}
.splash.s4{background:var(--four)} .splash.s6{background:var(--six)} .splash.sW{background:var(--wk)}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}
  20%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}

.bar{position:absolute;left:80px;right:80px;bottom:92px;height:128px;display:flex;
  background:rgba(11,16,32,.94);border-radius:10px 10px 0 0;overflow:hidden;box-shadow:0 -6px 40px rgba(0,0,0,.45)}
.brand{width:128px;flex:0 0 128px;position:relative;background:#FFDE59}
.brand img{width:128px;height:128px;display:block;object-fit:cover}
.logo-css{width:100%;height:100%;display:flex;flex-direction:column;font-family:Poppins,'Barlow Condensed',sans-serif;font-weight:800}
.logo-css div{flex:1;display:grid;place-items:center;font-size:24px}
.logo-css .l1{background:#FF3131;color:#fff}.logo-css .l2{background:#FFDE59;color:#111;font-size:19px}
.livetag{position:absolute;left:80px;bottom:228px;background:var(--brand);color:#fff;font-size:22px;font-weight:800;letter-spacing:2px;
  padding:3px 14px;border-radius:6px 6px 0 0;display:flex;gap:8px;align-items:center}
.livetag i{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.sndchip{position:absolute;left:50%;top:40px;transform:translateX(-50%);z-index:50;background:#FF3131;color:#fff;font-size:26px;font-weight:800;padding:10px 26px;border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.5);cursor:pointer;animation:blink 1.4s infinite}
.illus{position:absolute;right:80px;top:56px;background:rgba(0,0,0,.45);color:#fff;font-size:20px;font-weight:600;letter-spacing:1px;padding:6px 14px;border-radius:6px}
/* ===================== CARTOON SCENE ===================== */
#scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#scene svg{display:block}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-400px)}to{transform:translateX(2300px)}}
.crowdrow{animation:bob 1.6s ease-in-out infinite}
.crowdrow:nth-child(2n){animation-delay:-.8s}
@keyframes bob{50%{transform:translateY(-3px)}}
#crowd.cheer .crowdrow{animation:jump .35s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-14px)}}
.confetti{position:absolute;width:14px;height:22px;top:-30px;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(1150px) rotate(720deg)}}

.score{display:flex;align-items:center;gap:18px;padding:0 26px;flex:0 0 auto;border-left:10px solid var(--tc,#1f6feb);background:var(--panel)}
.score .tm{font-size:50px;font-weight:800;letter-spacing:2px}
.score .rw{font-size:84px;font-weight:800;line-height:1}
.score .rw span{font-size:60px;color:#cbd5e1}
.score .ov{display:flex;flex-direction:column;font-size:40px;font-weight:700;color:var(--gold);line-height:1}
.score .ov small{font-size:20px;margin-top:4px;color:var(--muted);white-space:nowrap}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}

.cell{display:flex;flex-direction:column;justify-content:center;padding:0 22px;min-width:0;border-left:1px solid var(--line)}
.lbl{font-size:18px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.bats{flex:1 1 380px;min-width:340px}
.brow{display:flex;justify-content:space-between;gap:14px;font-size:32px;font-weight:600;line-height:1.2}
.brow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow>span:last-child{white-space:nowrap;flex:0 0 auto}
.brow.on .nm::after{content:" *";color:var(--gold)}
.brow.on{color:#fff} .brow{color:#cbd5e1}
.brow b{font-weight:800;color:#fff} .brow em{font-style:normal;font-size:26px;color:var(--muted)}
.bowl{flex:0 1 250px}
.bowl .nm{font-size:34px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.bowl .fig{font-size:32px;font-weight:800;color:var(--gold)}
.recent{flex:0 0 auto} .recent .chips{display:flex;gap:6px}
.chip{min-width:42px;height:42px;padding:0 6px;border-radius:21px;display:grid;place-items:center;background:var(--panel2);
  font-size:24px;font-weight:800}
.chip.c4{background:var(--four)} .chip.c6{background:var(--six)} .chip.cW{background:var(--wk)} .chip.cX{background:var(--ext)}
.rates{margin-left:auto;flex:0 0 auto;text-align:right;align-items:flex-end}
.rates .r{font-size:30px;font-weight:700} .rates .r span{color:var(--muted);font-size:22px;margin-right:8px}

.ticker{position:absolute;left:80px;right:80px;bottom:44px;height:48px;display:flex;background:#000c;border-radius:0 0 10px 10px;overflow:hidden}
.ticker .st{background:var(--gold);color:#111;font-size:28px;font-weight:800;padding:0 26px;display:flex;align-items:center;white-space:nowrap;text-transform:uppercase;letter-spacing:1px}
.ticker .mq{flex:1;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.ticker .mq span{display:inline-block;padding-left:100%;font-size:28px;font-weight:600;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}

/* Full card (innings break / summary) */
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:1240px;background:rgba(11,16,32,.96);
  border-radius:16px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.card .hd{background:linear-gradient(90deg,var(--brand2),var(--brand));padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
.card .hd h1{font-size:46px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.card .hd .tag{font-size:26px;font-weight:700;background:rgba(0,0,0,.3);padding:4px 14px;border-radius:6px}
.card .teams{padding:26px 40px 10px}
.trow{display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:1px solid var(--line)}
.trow .sw{width:14px;height:56px;border-radius:4px}
.trow .tn{font-size:46px;font-weight:700;flex:1}
.trow .ts{font-size:56px;font-weight:800}
.trow .to{font-size:32px;color:var(--gold);font-weight:700;width:170px;text-align:right}
.card .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;padding:20px 40px}
.card table{width:100%;border-collapse:collapse;font-size:32px}
.card th{font-size:20px;letter-spacing:2px;color:var(--muted);text-align:right;font-weight:700;padding-bottom:6px}
.card th:first-child,.card td:first-child{text-align:left}
.card td{text-align:right;padding:6px 0;font-weight:600}
.card .ft{background:var(--gold);color:#111;font-size:36px;font-weight:800;text-align:center;padding:14px;text-transform:uppercase;letter-spacing:1px}

/* ===================== CONTROL PANEL ===================== */
body.control{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;min-height:100vh}
.cwrap{max-width:1400px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.cwrap{grid-template-columns:1fr}}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700}
.top h1 b{color:var(--brand)}
.pill{background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:99px;font-size:12px;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
input,select,textarea{background:#0b1226;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
input[type=color]{padding:2px;height:36px}
input:focus,select:focus{outline:2px solid #3b82f6;border-color:transparent}
button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.2)}
button.pri{background:#2563eb;border-color:#2563eb}
button.red{background:var(--wk);border-color:var(--wk)}
button.on{outline:2px solid var(--gold);background:#3a2f0b}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pad button{font-size:24px;padding:16px 0;font-weight:800}
.pad .k4{background:var(--four)} .pad .k6{background:var(--six)}
.xpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.wpad{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px}
.wpad button{padding:12px 0;font-size:16px}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big .s{font-size:40px;font-weight:800}
.big .o{font-size:20px;color:var(--gold);font-weight:700}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.warn{background:#3a2f0b;border:1px solid #7a5b00;color:#ffd166;padding:8px 10px;border-radius:8px;font-size:13px}
.ok{color:#4ade80}.err{color:#f87171}
.prev{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:repeating-conic-gradient(#1b2236 0 25%,#232c45 0 50%) 0 0/24px 24px}
.prev iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
.mlist{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mlist button{text-align:left;font-weight:500}
.recentc{display:flex;gap:6px;flex-wrap:wrap}
.recentc .chip{min-width:34px;height:34px;font-size:15px;font-family:'Barlow Condensed',sans-serif}
.need{outline:2px solid var(--gold)!important}
kbd{background:#0b1226;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>
<body>
<script>
/* =========================================================================
   Nukkad Live Adda — Live Cricket Scoreboard
   One file, two modes:
     index.html            -> transparent overlay for OBS (1920x1080)
     index.html?control=1  -> operator control panel (scoring + API sync)
   State is shared through localStorage + BroadcastChannel (same browser/OBS).
   ========================================================================= */
const KEY = 'nla_score_v1';
const IS_CONTROL = new URLSearchParams(location.search).has('control');
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('nla_score') : null;

const blankBat = () => ({ name:'', r:0, b:0, f:0, s:0 });
const DEFAULT = () => ({
  v:1, updated:0,
  title:'1st ODI • Eden Park, Auckland',
  teams:[ {name:'India', short:'IND', color:'#1f6feb'}, {name:'New Zealand', short:'NZ', color:'#1c1c1c'} ],
  bat:0, innings:1, maxOvers:50, target:0,
  runs:0, wkts:0, balls:0, extras:0,
  batters:[ {name:'Batter 1',r:0,b:0,f:0,s:0}, {name:'Batter 2',r:0,b:0,f:0,s:0} ], striker:0,
  bowler:{ name:'Bowler', balls:0, r:0, w:0 }, bowlers:{},
  recent:[], first:null, lastEvent:null,
  needBatter:-1, needBowler:false,
  view:'bar', banner:'', status:'', apiStatus:'', scene:true, ballId:0, lastTok:'', sound:true, ambience:false, volume:80, sndTest:0,
  logo:'https://yt3.googleusercontent.com/gURqZpoH4BTJh-_8CUTLuSArs1E5QCBcJpsUa2yNru_UY2aS8o2n12KmLgBa9p8eVCfC1hc-Wg=s400-c-k-c0x00ffffff-no-rj',
  ticker:'Watch the full match live score only on Nukkad Live Adda  •  Like, Share & Subscribe  •  Comment your prediction below',
  api:{ key:'', match:'', mode:'hybrid', limit:100, reserve:10, hours:8.5, auto:false,
        lastSync:0, hitsToday:null, hitsLimit:null, msg:'' }
});

let S = load() || DEFAULT();

function load(){
  try{ const raw = localStorage.getItem(KEY); if(!raw) return null;
       const d = JSON.parse(raw); const base = DEFAULT();
       return Object.assign(base, d, { api:Object.assign(base.api, d.api||{}) }); }
  catch(e){ return null; }
}
function save(){
  S.updated = Math.max(Date.now(), (S.updated||0) + 1);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(bc) try{ bc.postMessage(S); }catch(e){}
  render();
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ov = b => Math.floor(b/6) + '.' + (b%6);
/* TV-style short name for the score bar: 'Yashasvi Jaiswal' -> 'Y Jaiswal' */
const shortName = n => { n = String(n||'').trim(); const w = n.split(/\s+/); return (n.length > 10 && w.length > 1) ? w.slice(0,-1).map(x=>x[0]).join('') + ' ' + w[w.length-1] : n; };
const crr = s => s.balls ? (s.runs*6/s.balls).toFixed(2) : '0.00';
function rrr(s){
  if(!s.target || !s.maxOvers) return '';
  const left = s.maxOvers*6 - s.balls, need = s.target - s.runs;
  if(left<=0 || need<=0) return '';
  return (need*6/left).toFixed(2);
}
function autoStatus(s){
  const bt = s.teams[s.bat], bw = s.teams[1-s.bat];
  const oversDone = s.maxOvers>0 && s.balls >= s.maxOvers*6;
  if(s.target){
    const need = s.target - s.runs;
    if(need<=0){ const w = 10-s.wkts; return `${bt.name} won by ${w} wicket${w===1?'':'s'}`; }
    if(s.wkts>=10 || oversDone){ const m = s.target-1-s.runs; return m===0 ? 'Match tied' : `${bw.name} won by ${m} run${m===1?'':'s'}`; }
    if(s.maxOvers>0){ const left = s.maxOvers*6 - s.balls; return `${bt.short} need ${need} run${need===1?'':'s'} from ${left} ball${left===1?'':'s'}`; }
    return `${bt.short} need ${need} run${need===1?'':'s'} to win`;
  }
  if(s.wkts>=10 || oversDone) return `Innings complete • ${bt.short} ${s.runs}/${s.wkts}`;
  return `${bt.name} batting`;
}
const statusText = s => s.status || s.apiStatus || autoStatus(s);
function chipClass(t){
  if(t==='W') return 'cW';
  if(t==='4') return 'c4';
  if(t==='6') return 'c6';
  if(/Wd|Nb|B|Lb/.test(t)) return 'cX';
  return '';
}

/* =========================================================================
   OVERLAY
   ========================================================================= */
let lastShownEvent = 0, prevRuns = null;
function renderOverlay(){
  const s = S, bt = s.teams[s.bat], root = $('#ov');
  if(!root) return;
  const r = rrr(s);
  const bats = s.batters.map((b,i)=>`
      <div class="brow ${i===s.striker?'on':''}"><span class="nm">${esc(shortName(b.name)||'—')}</span><span><b>${b.r}</b> <em>(${b.b})</em></span></div>`).join('');
  const last6 = s.recent.slice(-6);
  const chips = last6.length ? last6.map(t=>`<div class="chip ${chipClass(t)}">${esc(t)}</div>`).join('') : '<div class="chip">–</div>';

  let html = '';
  if(s.view !== 'hidden'){
    html += `<div class="titlechip"><span class="dot"></span>${esc(s.teams[0].short)} vs ${esc(s.teams[1].short)} • ${esc(s.title)}</div>`;
    if(s.scene) html += `<div class="illus">Animated illustration • not match footage</div>`;
  }
  if(s.view === 'bar'){
    html += `
    ${s.banner ? `<div class="banner">${esc(s.banner)}</div>` : ''}
    <div class="splash" id="splash"></div>
    <div class="livetag"><i></i>LIVE SCORE</div>
    <div class="bar">
      <div class="brand">${s.logo ? `<img src="${esc(s.logo)}" alt="Nukkad Live Adda" onerror="this.outerHTML='<div class=&quot;logo-css&quot;><div class=&quot;l1&quot;>Nukkad</div><div class=&quot;l2&quot;>Live Adda</div></div>'">` : '<div class="logo-css"><div class="l1">Nukkad</div><div class="l2">Live Adda</div></div>'}</div>
      <div class="score" style="--tc:${esc(bt.color)}">
        <div class="tm">${esc(bt.short)}</div>
        <div class="rw" id="rw">${s.runs}<span>/${s.wkts}</span></div>
        <div class="ov">${ov(s.balls)}<small>${s.maxOvers?'/ '+s.maxOvers+' OV':'OV'}</small></div>
      </div>
      <div class="cell bats">${bats}</div>
      <div class="cell bowl"><div class="lbl">Bowler</div><div class="nm">${esc(shortName(s.bowler.name)||'—')}</div>
        <div class="fig">${s.bowler.w}-${s.bowler.r} <span style="color:var(--muted);font-size:24px">(${ov(s.bowler.balls)})</span></div></div>
      <div class="cell recent"><div class="lbl">Last 6 balls</div><div class="chips">${chips}</div></div>
      <div class="cell rates">
        <div class="r"><span>CRR</span>${crr(s)}</div>
        ${r ? `<div class="r"><span>RRR</span>${r}</div>` : ''}
        ${s.target ? `<div class="r"><span>TARGET</span>${s.target}</div>` : ''}
      </div>
    </div>
    <div class="ticker"><div class="st">${esc(statusText(s))}</div><div class="mq"><span style="animation-delay:-${((Date.now()/1000)%28).toFixed(2)}s">${esc(s.ticker)}</span></div></div>`;
  }
  if(s.view === 'card'){
    const f = s.first;
    const rowFor = (ti) => {
      const t = s.teams[ti];
      let sc = '', o = '';
      if(ti === s.bat){ sc = `${s.runs}/${s.wkts}`; o = `${ov(s.balls)} ov`; }
      else if(f && f.team === ti){ sc = `${f.runs}/${f.wkts}`; o = `${ov(f.balls)} ov`; }
      else { sc = 'Yet to bat'; }
      return `<div class="trow"><div class="sw" style="background:${esc(t.color)}"></div><div class="tn">${esc(t.name)}</div>
              <div class="ts" style="${sc==='Yet to bat'?'font-size:32px;color:var(--muted)':''}">${sc}</div><div class="to">${o}</div></div>`;
    };
    const order = f ? [f.team, 1-f.team] : [s.bat, 1-s.bat];
    html += `
    <div class="card">
      <div class="hd"><h1>${esc(s.teams[0].short)} vs ${esc(s.teams[1].short)}</h1><div class="tag">${esc(s.banner || s.title)}</div></div>
      <div class="teams">${order.map(rowFor).join('')}</div>
      <div class="grid">
        <table><tr><th>Batting</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>
          ${s.batters.map((b,i)=>`<tr><td>${esc(b.name||'—')}${i===s.striker?' *':''}</td><td>${b.r}</td><td>${b.b}</td><td>${b.f}</td><td>${b.s}</td></tr>`).join('')}
        </table>
        <table><tr><th>Bowling</th><th>O</th><th>R</th><th>W</th></tr>
          <tr><td>${esc(s.bowler.name||'—')}</td><td>${ov(s.bowler.balls)}</td><td>${s.bowler.r}</td><td>${s.bowler.w}</td></tr>

const IN_FRAME = window.top !== window.self;   // control-panel preview iframe stays silent
const SND = { ctx:null, master:null, noise:null, amb:null, ambG:null, testSeen:null };
function sndInit(){

  const len = ctx.sampleRate*2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);

}
function sndReady(){ return !IN_FRAME && S.sound !== false && SND.ctx && SND.ctx.state === 'running'; }

let lastCols = '';
function sceneColours(){

/* timeline (seconds) */
const RUN=1.5, DEL=0.35, FLY=0.7, OUT=1.9, BACK=2.4;

  if(!SC.cur){ const nx = SC.q.shift(); SC.cur = nx || 'dot'; SC.real = !!nx; SC.t0 = now; SC.fx = false; SC.sfx = false; }

      case 'wicket': { const v = clamp(u*3); bxp = P_HIT.x + (1362-P_HIT.x)*v; byp = P_HIT.y + (672-P_HIT.y)*v; if(u>.34){ const w=(u-.34); bxp = 1362 + 60*w; byp = 672 + 120*Math.min(1,w*3); } break; }
      case 'leave': { const v = clamp(u*3); bxp = 1300 + 120*v; byp = 610 + 10*v; if(v>=1) ballOn = u < .45; break; }
      default:     { const v = clamp(u*2); bxp = P_HIT.x - 60*v; byp = P_HIT.y + (712-P_HIT.y)*Math.min(1,v*1.5); }
    }
  }
  SC.ball.setAttribute('cx', bxp.toFixed(1)); SC.ball.setAttribute('cy', byp.toFixed(1)); SC.ball.setAttribute('r', br.toFixed(1));
  SC.ball.setAttribute('opacity', ballOn ? 1 : 0);

  /* ---- batter ---- (mirrored: positive angles lift the bat back) */
  let batA = 35, btx = 1310, bLeg = 0;
  const sw0 = T_HIT - 0.22;
  if(t < sw0 - 0.5) batA = 35 + 5*Math.sin(t*3);
  else if(t < sw0) batA = 35 + 85*ease((t - (sw0-0.5))/0.5);               // backlift
  else if(o === 'leave') batA = 120 - 60*clamp((t-sw0)/0.5);
  else { const sw = clamp((t - sw0)/0.38), big = (o==='six'||o==='four');
         const late = o==='wicket' ? 0.12 : 0; const swl = clamp((t - sw0 - late)/0.38);
         batA = 120 - (big ? 300 : 190)*ease(o==='wicket'?swl:sw); if(o==='dot') batA = Math.max(batA, -30); }
  if(t > T_END - 0.3) batA = 35 + (batA-35)*clamp((T_END+0.4-t)/0.7);
  if(o === 'run' && t > T_HIT + 0.3 && t < T_END){ const v = (t - T_HIT - 0.3)/(OUT-0.3); btx = 1310 - 330*Math.sin(Math.PI*v); bLeg = Math.sin(t*16)*30; }
  tf(SC.batter, btx, 712, -1, 1);
  rot(SC.btbarm, -batA, 0, -112); rot(SC.btbl1, bLeg, 0, -64); rot(SC.btbl2, -bLeg, 0, -64);
  // non-striker runs too
  if(o === 'run' && t > T_HIT + 0.3 && t < T_END){ const v = (t - T_HIT - 0.3)/(OUT-0.3); tf(SC.ns, 470 + 330*Math.sin(Math.PI*v), 708, .95); }
  else tf(SC.ns, 470, 708, .95);

  /* ---- keeper, stumps, effects ---- */
  rot(SC.kparm, (o==='leave' && t > T_HIT && t < T_HIT+0.6) ? -60 : -10, 0, -112);
  if(o === 'wicket' && t > T_HIT + OUT*0.33){
    const w = clamp((t - T_HIT - OUT*0.33)/0.8);
    tf(SC.bails, 30*w, -160*Math.sin(Math.PI*w*0.9), 1, 1, 400*w);
    rot(SC.st0, -14*clamp(w*3), 3, 0); rot(SC.st2, 16*clamp(w*3), 23, 0);
  } else if(t < 0.1){ SC.bails.removeAttribute('transform'); SC.st0.removeAttribute('transform'); SC.st2.removeAttribute('transform'); }
  if(!SC.sfx && SC.real && t > (o === 'wicket' ? T_HIT + OUT*0.33 : T_HIT)){ SC.sfx = true; sfx(o); }
  if(!SC.fx && t > T_HIT + 0.15){
    SC.fx = true;
    if(o === 'six'){ cheer(2600); confetti(); }
    else if(o === 'four' || o === 'wicket') cheer(2000);
  }
}

/* =========================================================================
   CONTROL PANEL — scoring engine
   ========================================================================= */
let undoStack = [], pending = null;
function snap(){ const c = JSON.parse(JSON.stringify(S)); delete c.api; undoStack.push(c); if(undoStack.length>80) undoStack.shift(); }
function undo(){
  const c = undoStack.pop(); if(!c) return flash('Nothing to undo');
  const api = S.api; S = Object.assign(DEFAULT(), c, {api}); save(); fill(true);
}
function swapStrike(){ S.striker = 1 - S.striker; }

function addBall(kind, n=0){
  snap();
  const s = S, bat = s.batters[s.striker], bowl = s.bowler;
  let legal = true, total = 0, tok = '', rot = 0, wicketIdx = -1;
  switch(kind){
    case 'run':
      total = n; bat.r += n; bat.b++; if(n===4) bat.f++; if(n===6) bat.s++;
      bowl.r += n; tok = n===0 ? '•' : String(n); rot = n; break;
    case 'wd':
      legal = false; total = 1+n; s.extras += total; bowl.r += total; tok = 'Wd' + (n?'+'+n:''); rot = n; break;
    case 'nb':
      legal = false; total = 1+n; s.extras += 1; bat.r += n; bat.b++; if(n===4) bat.f++; if(n===6) bat.s++;
      bowl.r += total; tok = 'Nb' + (n?'+'+n:''); rot = n; break;
    case 'b': case 'lb':
      total = n; s.extras += n; bat.b++; tok = n ? n + (kind==='b'?'B':'Lb') : '•'; rot = n; break;
    case 'w':    // bowler's wicket (bowled/caught/lbw/stumped) — striker out
      bat.b++; bowl.w++; s.wkts++; tok = 'W'; wicketIdx = s.striker; break;
    case 'ro':   // run out — striker
      bat.b++; s.wkts++; tok = 'W'; wicketIdx = s.striker; break;
    case 'rons': // run out — non-striker
      bat.b++; s.wkts++; tok = 'W'; wicketIdx = 1 - s.striker; break;
  }
  s.runs += total;
  if(legal){ s.balls++; bowl.balls++; }
  if(rot % 2 === 1) swapStrike();
  if(wicketIdx >= 0){ s.batters[wicketIdx] = blankBat(); s.needBatter = wicketIdx; }
  s.recent.push(tok); if(s.recent.length > 12) s.recent = s.recent.slice(-12);
  s.ballId = (s.ballId||0) + 1; s.lastTok = tok;
  if(tok==='W' || (kind==='run' && (n===4 || n===6))) s.lastEvent = { t: tok==='W'?'W':String(n), id: Date.now() };
  s.bowlers[bowl.name] = { ...bowl };
  if(legal && s.balls % 6 === 0 && s.balls > 0){ swapStrike(); s.needBowler = true; }
  pending = null;
  save(); fill(true);
  if(s.needBatter >= 0) focusSoon('#bat' + s.needBatter);
  else if(s.needBowler) focusSoon('#bowlName');
}
function focusSoon(sel){ setTimeout(()=>{ const el=$(sel); if(el){ el.focus(); el.select(); } }, 30); }

function setBowler(name){
  name = name.trim(); if(!name) return;
  if(S.bowler.name) S.bowlers[S.bowler.name] = { ...S.bowler };
  S.bowler = S.bowlers[name] ? { ...S.bowlers[name] } : { name, balls:0, r:0, w:0 };
  S.needBowler = false; save();
}

function nextInnings(){
  snap();
  S.first = { team:S.bat, runs:S.runs, wkts:S.wkts, balls:S.balls };
  if(S.innings === 1) S.target = S.runs + 1;
  S.innings++; S.bat = 1 - S.bat;
  Object.assign(S, { runs:0, wkts:0, balls:0, extras:0, recent:[], striker:0, bowlers:{},
    batters:[{...blankBat(),name:'Opener 1'},{...blankBat(),name:'Opener 2'}],
    bowler:{name:'Bowler',balls:0,r:0,w:0}, needBatter:-1, needBowler:false, status:'', apiStatus:'', lastEvent:null });
  save(); fill(true);
}

/* =========================================================================
   CricAPI (cricketdata.org) — budgeted sync
   ========================================================================= */
const API = 'https://api.cricapi.com/v1/';
const parseOv = o => { const x = Number(o)||0, f = Math.floor(x); return f*6 + Math.round((x-f)*10); };
const pname = p => (p && typeof p === 'object') ? (p.name || '') : (p || '');

async function apiCall(path){
  if(!S.api.key) throw new Error('Add your API key first');
  const res = await fetch(API + path + (path.includes('?')?'&':'?') + 'apikey=' + encodeURIComponent(S.api.key));
  const j = await res.json();
  if(j.info){ S.api.hitsToday = j.info.hitsToday ?? S.api.hitsToday; S.api.hitsLimit = j.info.hitsLimit ?? S.api.hitsLimit; }
  if(j.status !== 'success') throw new Error(j.reason || j.status || 'API error');
  return j.data;
}

async function findMatches(){
  const box = $('#mlist'); box.innerHTML = '<div class="hint">Loading… (uses 1 hit)</div>';
  try{
    const data = await apiCall('currentMatches?offset=0');
    const live = (data||[]).filter(m => m.matchStarted && !m.matchEnded);
    const list = live.length ? live : (data||[]);
    box.innerHTML = list.length ? '' : '<div class="hint">No matches returned.</div>';
    list.slice(0,25).forEach(m=>{
      const b = document.createElement('button');
      b.innerHTML = `<b>${esc(m.name)}</b><br><span class="hint">${esc(m.status||'')}</span>`;
      b.onclick = () => { S.api.match = m.id; save(); fill(true); flash('Match selected'); };
      box.appendChild(b);
    });
    S.api.msg = 'Match list loaded'; save();
  }catch(e){ box.innerHTML = `<div class="err">${esc(e.message)}</div>`; S.api.msg = e.message; save(); }
}

async function syncNow(force=false){
  if(!S.api.match){ S.api.msg = 'Pick a match first'; save(); return; }
  try{
    const d = await apiCall('match_scorecard?id=' + encodeURIComponent(S.api.match));
    S.api.lastSync = Date.now();
    S.api.msg = applyApi(d, force);
  }catch(e){ S.api.lastSync = Date.now(); S.api.msg = 'Sync failed: ' + e.message; }
  save(); fill(true);
}

function applyApi(d, force){
  const sc = d.score || [];
  // team names
  const tn = d.teams || [], ti = d.teamInfo || [];
  if(tn.length === 2 && (force || S.api.mode==='api' || (S.teams[0].name==='Team A'||!S.api.lastSync))){
    tn.forEach((name,i)=>{
      const inf = ti.find(t => t.name === name);
      S.teams[i].name = name;
      S.teams[i].short = (inf && inf.shortname) || name.slice(0,3).toUpperCase();
    });
  }
  if(d.matchEnded && d.status) S.apiStatus = d.status;
  if(!sc.length) return 'Match has not started yet';

  const cur = sc[sc.length-1];
  const inn = sc.length, aBalls = parseOv(cur.o);
  const ahead = inn > S.innings || (inn === S.innings && aBalls > S.balls);
  if(!(force || S.api.mode==='api' || ahead)) return `OK — your manual score is up to date (API: ${cur.r}/${cur.w} in ${ov(aBalls)})`;

  snap();
  const iname = String(cur.inning||'').toLowerCase();
  const bi = S.teams.findIndex(t => iname.startsWith(t.name.toLowerCase()));
  if(inn > S.innings && inn >= 2){
    const prev = sc[inn-2];
    S.first = { team: bi>=0 ? 1-bi : 1-S.bat, runs: prev.r, wkts: prev.w, balls: parseOv(prev.o) };
    if(inn === 2) S.target = prev.r + 1;
    S.recent = []; S.bowlers = {};
  }
  S.innings = inn; if(bi >= 0) S.bat = bi;
  S.runs = cur.r; S.wkts = cur.w; S.balls = aBalls;

  const cards = d.scorecard || [];
  const card = cards.find(c => String(c.inning||'').toLowerCase() === iname) || cards[cards.length-1];
  if(card){
    const notOut = (card.batting||[]).filter(x => /not out|batting/i.test(x['dismissal-text'] || x.dismissal || ''));
    if(notOut.length){
      const striker = S.batters[S.striker] && S.batters[S.striker].name;
      const arr = notOut.slice(0,2).map(x => ({ name:pname(x.batsman), r:+x.r||0, b:+x.b||0, f:+x['4s']||0, s:+x['6s']||0 }));
      while(arr.length < 2) arr.push(blankBat());
      S.batters = arr;
      const k = arr.findIndex(b => b.name === striker); S.striker = k >= 0 ? k : 0;
      S.needBatter = -1;
    }
    const bl = card.bowling || [];
    const cb = bl.find(x => { const o = String(x.o); return o.includes('.') && !o.endsWith('.0'); }) || bl[bl.length-1];
    if(cb){ S.bowler = { name:pname(cb.bowler), balls:parseOv(cb.o), r:+cb.r||0, w:+cb.w||0 }; S.needBowler = false; }
  }
  if(d.status && (d.matchEnded || S.api.mode==='api')) S.apiStatus = d.status;
  return `Updated from API: ${cur.r}/${cur.w} (${ov(aBalls)} ov)`;
}

/* budget: spread remaining daily hits across the expected match length */
function intervalMs(){
  const lim = S.api.hitsLimit || S.api.limit || 100;
  const used = S.api.hitsToday || 0;
  const left = Math.max(1, lim - used - (S.api.reserve||0));
  const mins = Math.max(1, (S.api.hours||4) * 60 / left);
  return mins * 60000;
}
function tickAuto(){
  const el = $('#nextSync'); if(!el) return;
  if(!S.api.auto){ el.textContent = 'Auto-sync off'; return; }
  const lim = S.api.hitsLimit || S.api.limit, used = S.api.hitsToday || 0;
  if(used >= lim - 1){ el.textContent = 'Daily hit limit reached — manual only'; return; }
  const due = (S.api.lastSync || 0) + intervalMs(), left = due - Date.now();
  if(left <= 0){ el.textContent = 'Syncing…'; S.api.lastSync = Date.now(); syncNow(false); return; }
  const m = Math.floor(left/60000), sec = Math.floor(left%60000/1000);
  el.textContent = `Next auto-sync in ${m}:${String(sec).padStart(2,'0')} (every ${(intervalMs()/60000).toFixed(1)} min)`;
}

  $('#banner').onchange = e => { S.banner = e.target.value; save(); };
  $('#status').oninput = e => { S.status = e.target.value; save(); };
  $('#ticker').oninput = e => { S.ticker = e.target.value; save(); };

  // setup
  $('#title').oninput = e => { S.title = e.target.value; save(); };
  $('#maxOvers').onchange = e => { S.maxOvers = +e.target.value; save(); };
  [0,1].forEach(i => {
    $('#tn'+i).oninput = e => { S.teams[i].name = e.target.value; save(); };
    $('#ts'+i).oninput = e => { S.teams[i].short = e.target.value.toUpperCase(); save(); };
    $('#tc'+i).oninput = e => { S.teams[i].color = e.target.value; save(); };
  });
  $('#batSel').onchange = e => { S.bat = +e.target.value; save(); };
  $('#logoUrl').onchange = e => { S.logo = e.target.value.trim(); save(); };
  $('#bScene').onclick = () => { S.scene = !S.scene; save(); fill(); };
  $('#bSound').onclick = () => { S.sound = S.sound === false; save(); fill(); };
  $('#bAmb').onclick = () => { S.ambience = !S.ambience; save(); fill(); };
  $('#vol').oninput = e => { S.volume = +e.target.value; save(); };
  $('#bSndTest').onclick = () => { S.sndTest = Date.now(); save(); flash('Test sound sent to overlay'); };
  $('#innNo').onchange = e => { S.innings = Math.max(1, +e.target.value||1); save(); };

  // api
  $('#apiKey').onchange = e => { S.api.key = e.target.value.trim(); save(); };
  $('#apiMatch').onchange = e => { S.api.match = e.target.value.trim(); save(); };
  $('#apiMode').onchange = e => { S.api.mode = e.target.value; if(S.api.mode==='manual') S.api.auto=false; save(); fill(true); };
  $('#apiLimit').onchange = e => { S.api.limit = +e.target.value||100; save(); };
  $('#apiReserve').onchange = e => { S.api.reserve = +e.target.value||0; save(); };
  $('#apiHours').onchange = e => { S.api.hours = +e.target.value||4; save(); };
  $('#bFind').onclick = findMatches;
  $('#bSync').onclick = () => syncNow(false);
  $('#bForce').onclick = () => syncNow(true);
  $('#bAuto').onclick = () => {
    if(S.api.mode==='manual') return flash('Switch mode to Hybrid or API first');
    S.api.auto = !S.api.auto; save(); fill(true);
  };

  // backup
  $('#bExport').onclick = () => {
    const c = JSON.parse(JSON.stringify(S)); c.api.key = '';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(c,null,2)], {type:'application/json'}));
    a.download = `score-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`; a.click();
  };
  $('#bImport').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ const d = JSON.parse(await f.text()); const api = S.api; S = Object.assign(DEFAULT(), d, {api}); save(); fill(true); flash('Backup restored'); }
    catch(err){ flash('Invalid backup file'); }
  };
  let rstArm = 0;
  $('#bReset').onclick = (e) => {
    if(Date.now() - rstArm > 4000){ rstArm = Date.now(); e.target.textContent = 'Tap again to erase score'; setTimeout(()=>e.target.textContent='Reset match',4000); return; }
    snap(); const keep = { api:S.api, teams:S.teams, title:S.title, ticker:S.ticker, maxOvers:S.maxOvers };
    S = Object.assign(DEFAULT(), keep); S.api.auto = false; save(); fill(true); e.target.textContent='Reset match'; flash('Match reset (Undo restores it)');
  };

  // keyboard
  document.addEventListener('keydown', e => {
    if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(e.ctrlKey || e.metaKey || e.altKey) { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); } return; }
    const k = e.key.toLowerCase();
    if(/^[0-6]$/.test(k)) return runKey(+k);
    const map = { d:'wd', n:'nb', b:'b', l:'lb' };
    if(map[k]){ pending = pending===map[k] ? null : map[k]; return fill(); }
    if(k==='w') return addBall('w');
    if(k==='s'){ snap(); swapStrike(); save(); return fill(true); }
    if(k==='u') return undo();
  });

  fill(true);
  setInterval(tickAuto, 1000);
}

function runKey(n){ if(pending) addBall(pending, n); else addBall('run', n); }

let flashT;
function flash(msg){ const el = $('#saved'); if(!el) return; el.textContent = msg; el.style.color = 'var(--gold)';
  clearTimeout(flashT); flashT = setTimeout(()=>{ el.textContent='Saved'; el.style.color=''; }, 2500); }

/* write state into control inputs (skips the field you're typing in) */
function fill(force){
  if(!IS_CONTROL) return;
  const s = S, set = (sel, v) => { const el = $(sel); if(el && (force || el !== document.activeElement) && el !== document.activeElement) el.value = v; };
  const bt = s.teams[s.bat];
  $('#cScore').textContent = `${bt.short} ${s.runs}/${s.wkts}`;
  $('#cOv').textContent = `${ov(s.balls)} ov · CRR ${crr(s)}${rrr(s)?' · RRR '+rrr(s):''}${s.target?' · Target '+s.target:''}`;
  $('#cStat').textContent = statusText(s);
  $('#cRecent').innerHTML = s.recent.map(t=>`<div class="chip ${chipClass(t)}">${esc(t)}</div>`).join('');
  document.querySelectorAll('[data-x]').forEach(b => b.classList.toggle('on', b.dataset.x === pending));
  $('#pendHint').textContent = pending ? `${{wd:'Wide',nb:'No-ball',b:'Bye',lb:'Leg-bye'}[pending]} selected — now tap runs taken (• = none)` :
    'Extras: tap Wide / No-ball / Bye / Leg-bye, then the runs taken (• for none).';
  [0,1].forEach(i => {
    set('#bat'+i, s.batters[i].name);
    const b = s.batters[i];
    $('#st'+i).textContent = `${i===s.striker?'★ on strike · ':''}${b.r} (${b.b})`;
    $('#bat'+i).classList.toggle('need', s.needBatter===i);
  });
  set('#bowlName', s.bowler.name);
  $('#bowlName').classList.toggle('need', s.needBowler);
  $('#bowlFig').value = `${ov(s.bowler.balls)}-${s.bowler.r}-${s.bowler.w}`;
  $('#needHint').innerHTML = s.needBatter>=0 ? '<span style="color:var(--gold)">Wicket! Type the new batter\'s name.</span>' :
    s.needBowler ? '<span style="color:var(--gold)">Over complete. Type the next bowler and press Enter (same name = his figures continue).</span>' : '';
  set('#eRuns', s.runs); set('#eWk', s.wkts); set('#eOv', ov(s.balls)); set('#eTgt', s.target||0);
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === s.view));
  set('#banner', s.banner); set('#status', s.status); set('#ticker', s.ticker);
  set('#title', s.title); set('#maxOvers', String(s.maxOvers));
  [0,1].forEach(i => { set('#tn'+i, s.teams[i].name); set('#ts'+i, s.teams[i].short); set('#tc'+i, s.teams[i].color); });
  const bs = $('#batSel'); bs.options[0].text = s.teams[0].name; bs.options[1].text = s.teams[1].name; set('#batSel', String(s.bat));
  set('#innNo', s.innings); set('#logoUrl', s.logo||'');
  const bsc = $('#bScene'); bsc.textContent = 'Cartoon match: ' + (s.scene ? 'ON' : 'OFF'); bsc.classList.toggle('on', !!s.scene);
  const bso = $('#bSound'); bso.textContent = 'Sound: ' + (s.sound !== false ? 'ON' : 'OFF'); bso.classList.toggle('on', s.sound !== false);
  const bam = $('#bAmb'); bam.textContent = 'Crowd background: ' + (s.ambience ? 'ON' : 'OFF'); bam.classList.toggle('on', !!s.ambience);
  if(document.activeElement !== $('#vol')) $('#vol').value = s.volume ?? 80;
  set('#apiKey', s.api.key); set('#apiMatch', s.api.match); set('#apiMode', s.api.mode);
  set('#apiLimit', s.api.limit); set('#apiReserve', s.api.reserve); set('#apiHours', s.api.hours);
  const ba = $('#bAuto'); ba.textContent = 'Auto-sync: ' + (s.api.auto ? 'ON' : 'OFF'); ba.classList.toggle('on', s.api.auto);
  const hits = s.api.hitsToday != null ? `Hits used today: <b>${s.api.hitsToday}/${s.api.hitsLimit||s.api.limit}</b> · ` : '';
  const last = s.api.lastSync ? `Last sync ${new Date(s.api.lastSync).toLocaleTimeString()} · ` : '';
  $('#apiInfo').innerHTML = hits + last + esc(s.api.msg||'');
}

/* =========================================================================
   BOOT
   ========================================================================= */
function render(){ if(!IS_CONTROL){ renderOverlay(); sceneSync(S); } }
function onRemote(d){ if(!d || !d.updated || d.updated <= S.updated) return; S = d; if(IS_CONTROL) fill(); else { renderOverlay(); sceneSync(S); } }

if(IS_CONTROL){
  buildControl();
} else {
  document.body.className = 'overlay';
  buildScene();
  // auto-fit: full 16:9 frame in any window (OBS at 1920x1080 stays at scale 1)
  const fitView = () => {
    const k = Math.min(innerWidth/1920, innerHeight/1080);
    document.documentElement.style.overflow = 'hidden';
    document.documentElement.style.background = k < 0.999 ? '#000' : 'transparent';
    document.body.style.transformOrigin = '0 0';
    document.body.style.transform = k < 0.999 ? `translate(${((innerWidth-1920*k)/2).toFixed(1)}px,${((innerHeight-1080*k)/2).toFixed(1)}px) scale(${k})` : '';
  };
  fitView(); window.addEventListener('resize', fitView);
  document.body.insertAdjacentHTML('beforeend', '<div id="ov"></div><div id="sndchip" class="sndchip" style="display:none">🔊 Sound chalu karne ke liye yahan ek baar click karein</div>');
  ['pointerdown','keydown'].forEach(ev => window.addEventListener(ev, sndUnlock));
  renderOverlay(); sceneSync(S);
  // safety net: poll storage every second (in case events are missed)
  setInterval(() => { const d = load(); if(d) onRemote(d); }, 1000);
}
if(bc) bc.onmessage = e => onRemote(e.data);
window.addEventListener('storage', e => { if(e.key === KEY){ try{ onRemote(JSON.parse(e.newValue)); }catch(_){} } });
</script>
</body>
